name: Playbook

# Validate, upload and backtest the GetAgent Playbook.
#
# The Playbook API key lives only as a repository secret. It is never pasted
# into a chat, written to disk, or placed on an argv the process table can read
# - curl takes it from the environment through a header file on stdin.
#
# Manual dispatch only. This talks to a third-party control plane and costs a
# sandbox run; it has no business firing on every push.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "what to do"
        type: choice
        options: [validate, backtest, inspect, confirm, publish]
        default: validate
      id:
        description: "run id for inspect; draft/temporary id for confirm and publish"
        type: string
        required: false
      bump:
        description: "semver bump for publish"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

env:
  PACKAGE: playbook/ballast-overnight-protection
  API: https://api.bitget.com

jobs:
  playbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the GetAgent skill (brings its own validator)
        run: |
          npx --yes @bitget-ai/getagent-skill@latest install --client claude
          # pandas so the malformed-bar guard actually runs; it is a CI tool
          # here, not a Ballast runtime dependency.
          python -m pip install --quiet pyyaml pandas

      # The package must never reach the control plane in a state its own
      # validator rejects. This is the same check run during authoring.
      - name: Validate the package
        run: python "$HOME/.claude/skills/getagent/scripts/validate.py" "$PACKAGE/"

      # PYTHONDONTWRITEBYTECODE, because this step imports the package's own
      # window.py and would otherwise leave a .pyc inside src/ that the
      # upload then rejects as a local-only path.
      - name: The night selector must still be correct
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest tests.test_playbook -v

      - name: Upload and backtest
        if: inputs.task == 'backtest'
        env:
          PLAYBOOK_API_KEY: ${{ secrets.PLAYBOOK_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PLAYBOOK_API_KEY}" ]; then
            echo "::error::PLAYBOOK_API_KEY is not set on this repository"
            exit 1
          fi
          # Header from a file, so the key is not visible in `ps`.
          printf 'ACCESS-KEY: %s\n' "$PLAYBOOK_API_KEY" > /tmp/h
          trap 'rm -f /tmp/h' EXIT

          tar czf /tmp/package.tar.gz --exclude="__pycache__" \
            --exclude="*.pyc" -C "$PACKAGE" .
          echo "package $(stat -c%s /tmp/package.tar.gz) bytes"

          curl -sS -X POST -H @/tmp/h -F "package=@/tmp/package.tar.gz" \
            "$API/api/v1/playbook/upload" -o /tmp/upload.json
          cat /tmp/upload.json
          # The API reference documents a flat success body; the live service
          # nests it under "data". Read both rather than trusting either.
          DRAFT=$(python -c "
          import json
          d = json.load(open('/tmp/upload.json'))
          print(d.get('draft_id') or (d.get('data') or {}).get('draft_id') or '')")
          if [ -z "$DRAFT" ]; then
            echo "::error::upload returned no draft_id"
            exit 1
          fi

          curl -sS -X POST -H @/tmp/h -H "Content-Type: application/json" \
            -d "{\"version_id\":\"$DRAFT\"}" \
            "$API/api/v1/playbook/run" -o /tmp/run.json
          cat /tmp/run.json
          RUN=$(python -c "
          import json
          d = json.load(open('/tmp/run.json'))
          b = d.get('data') if isinstance(d.get('data'), dict) else d
          print(b.get('run_id') or b.get('id') or '')")
          if [ -z "$RUN" ]; then
            echo "::error::run was not dispatched"; exit 1
          fi
          echo "dispatched run $RUN"

      - name: Wait for the sandbox run and report what it measured
        if: inputs.task == 'backtest'
        env:
          PLAYBOOK_API_KEY: ${{ secrets.PLAYBOOK_API_KEY }}
        run: |
          set -euo pipefail
          printf 'ACCESS-KEY: %s\n' "$PLAYBOOK_API_KEY" > /tmp/h
          trap 'rm -f /tmp/h' EXIT
          RUN=$(python -c "
          import json
          d = json.load(open('/tmp/run.json'))
          b = d.get('data') if isinstance(d.get('data'), dict) else d
          print(b.get('run_id') or b.get('id') or '')")

          # The sandbox run is asynchronous. Poll rather than assume, and stop
          # on a terminal status rather than on a fixed sleep that would report
          # "pending" as though it were the result.
          for i in $(seq 1 60); do
            curl -sS -H @/tmp/h "$API/api/v1/playbook/run?run_id=$RUN" -o /tmp/poll.json
            STATE=$(python -c "
          import json
          d = json.load(open('/tmp/poll.json'))
          b = d.get('data') if isinstance(d.get('data'), dict) else d
          print(b.get('status') or '')")
            echo "  attempt $i: ${STATE:-unknown}"
            case "$STATE" in completed|failed|error|cancelled) break;; esac
            sleep 15
          done

          cp /tmp/poll.json /tmp/result.json
          python -c "
          import json
          d = json.load(open('/tmp/result.json'))
          b = d.get('data') if isinstance(d.get('data'), dict) else d
          m = b.get('metrics_output') or {}
          print()
          print('run      ', b.get('run_id'))
          print('status   ', b.get('status'))
          if b.get('failure_reason'):
              print('failure  ', b['failure_reason'])
          if m:
              print()
              print('  total return %  ', m.get('total_return_pct'))
              print('  max drawdown %  ', m.get('max_drawdown_pct'))
              print('  win rate        ', m.get('win_rate'))
              print('  total trades    ', m.get('total_trades'))
              print('  sharpe          ', m.get('sharpe_ratio'))
          else:
              print()
              print('  no metrics_output on the record')
          "


      # Read an existing run record back rather than re-running the sandbox.
      # Publishing a backtest_support: full Playbook requires the run to carry a
      # real equity curve, not only aggregate metrics, and the only way to know
      # whether ours does is to look at the record the platform kept.
      - name: Inspect a run record
        if: inputs.task == 'inspect'
        env:
          PLAYBOOK_API_KEY: ${{ secrets.PLAYBOOK_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${{ inputs.id }}" ]; then
            echo "::error::inspect needs a run id in the 'id' input"; exit 1
          fi
          printf 'ACCESS-KEY: %s\n' "$PLAYBOOK_API_KEY" > /tmp/h
          trap 'rm -f /tmp/h' EXIT
          curl -sS -H @/tmp/h \
            "$API/api/v1/playbook/run?run_id=${{ inputs.id }}" -o /tmp/result.json
          python - <<'PY'
          import json
          d = json.load(open("/tmp/result.json"))
          b = d.get("data") if isinstance(d.get("data"), dict) else d

          def walk(node, path=""):
              """Every key in the record, so nothing is missed by guessing."""
              if isinstance(node, dict):
                  for k, v in node.items():
                      yield from walk(v, f"{path}.{k}" if path else k)
              elif isinstance(node, list):
                  yield f"{path}[]", f"{len(node)} items"
                  if node:
                      yield from walk(node[0], f"{path}[0]")
              else:
                  text = str(node)
                  yield path, text if len(text) <= 80 else text[:77] + "..."

          print("=== every field on the run record ===")
          for key, value in walk(b):
              print(f"  {key} = {value}")

          print()
          print("=== the publish question: is there a real equity curve? ===")
          hits = [k for k, _ in walk(b) if "equity" in k.lower() or "curve" in k.lower()]
          print("  keys mentioning equity/curve:", hits or "NONE")
          print()
          print("=== the basis question: which denominator? ===")
          m = b.get("metrics_output") or {}
          for key in ("total_return_pct", "account_total_return_pct", "net_pnl",
                      "starting_balance", "margin_budget", "metrics_basis",
                      "max_drawdown_pct", "account_max_drawdown_pct"):
              print(f"  {key} = {m.get(key)}")

          # Last, because a long log gets read from the end: the ids the
          # confirm and publish tasks need.
          print()
          print("=== ids ===")
          for key in ("run_id", "playbook_id", "version_id", "strategy_id",
                      "draft_id", "temporary_id", "status"):
              if b.get(key):
                  print(f"  {key} = {b[key]}")
          PY


      # confirm and publish are separate, explicitly-chosen tasks. Neither can
      # happen as a side effect of a backtest, and neither starts or stops
      # anything - Paper Trading is enabled by the account owner in GetAgent
      # Studio, and no API call here can or should do it for them.
      - name: Confirm the temporary artifact as a draft
        if: inputs.task == 'confirm'
        env:
          PLAYBOOK_API_KEY: ${{ secrets.PLAYBOOK_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${{ inputs.id }}" ]; then
            echo "::error::confirm needs the temporary id in the 'id' input"; exit 1
          fi
          printf 'ACCESS-KEY: %s\n' "$PLAYBOOK_API_KEY" > /tmp/h
          trap 'rm -f /tmp/h' EXIT
          echo "POST $API/api/v1/playbook/confirm"
          echo "ACCESS-KEY ${PLAYBOOK_API_KEY:0:4}...${PLAYBOOK_API_KEY: -4}"
          curl -sS -X POST -H @/tmp/h -H "Content-Type: application/json" \
            -d "{\"temporary_id\":\"${{ inputs.id }}\"}" \
            "$API/api/v1/playbook/confirm" -o /tmp/confirm.json
          cat /tmp/confirm.json

      - name: Publish the draft
        if: inputs.task == 'publish'
        env:
          PLAYBOOK_API_KEY: ${{ secrets.PLAYBOOK_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${{ inputs.id }}" ]; then
            echo "::error::publish needs the draft id in the 'id' input"; exit 1
          fi
          printf 'ACCESS-KEY: %s\n' "$PLAYBOOK_API_KEY" > /tmp/h
          trap 'rm -f /tmp/h' EXIT
          echo "POST $API/api/v1/playbook/publish"
          echo "ACCESS-KEY ${PLAYBOOK_API_KEY:0:4}...${PLAYBOOK_API_KEY: -4}"
          echo "draft ${{ inputs.id }}  bump ${{ inputs.bump }}"
          curl -sS -X POST -H @/tmp/h -H "Content-Type: application/json" \
            -d "{\"draft_id\":\"${{ inputs.id }}\",\"bump_type\":\"${{ inputs.bump }}\"}" \
            "$API/api/v1/playbook/publish" -o /tmp/publish.json
          cat /tmp/publish.json
          python - <<'PY'
          import json, sys
          d = json.load(open("/tmp/publish.json"))
          b = d.get("data") if isinstance(d.get("data"), dict) else d
          if b.get("status") != "published":
              print("::error::publish did not return status=published")
              sys.exit(1)
          print()
          print("published", b.get("version"), "as", b.get("version_id"))
          print()
          print("Next step is yours, not this workflow's: open My Playbooks in")
          print("GetAgent Studio and enable Paper Trading. Nothing here may")
          print("start, stop or enable a Playbook instance.")
          PY


      - name: Publish the run output as an artifact
        if: inputs.task == 'backtest'
        uses: actions/upload-artifact@v4
        with:
          name: playbook-run
          path: |
            /tmp/upload.json
            /tmp/run.json
            /tmp/result.json
          if-no-files-found: warn
