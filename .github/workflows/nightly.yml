name: Ballast nightly

# The paper-trading log is the one deliverable that cannot be compressed: the
# handbook requires it to be produced DURING the competition, and a night missed
# is a night that cannot be recovered. So the loop runs on a schedule rather than
# by hand, and commits the signed ledger back to the repository.
#
# That commit history is itself evidence. Each decision is written before its
# outcome is known, and GitHub timestamps the commit independently of us — so the
# hash-chained ledger and the commit log together show the record was not
# backfilled.
#
# Times are UTC and the crons are set for EDT (US close 20:00Z, open 13:30Z).
# US clocks fall back on 2026-11-01, after this competition ends.

# GitHub treats schedules as best effort and has delayed this repository's by
# 1h23m, 1h52m and 3h17m in one week. A settlement can always catch up - it grades
# whatever is outstanding - but a night that is never decided cannot be recovered,
# and the paper log is the one required material that cannot be backfilled.
#
# So the decide half has three independent chances instead of one. Deciding twice
# is already a no-op, so a later trigger firing after an earlier one succeeded
# costs nothing; the only thing it can do is rescue a night that would otherwise
# be lost. All three land inside the window with room to spare - midnight UTC is
# four hours past a 20:00Z close, well inside the half-window limit at which a
# decision is refused as too late to mean anything.
on:
  schedule:
    - cron: "0 21 * * 1-5"     # 17:00 ET - one hour after the close
    - cron: "30 22 * * 1-5"    # backup, if the first was delayed or dropped
    - cron: "0 0 * * 2-6"      # last chance, 4h after the close it belongs to
    - cron: "30 14 * * 1-5"    # 10:30 ET - one hour after the open
    - cron: "0 17 * * 1-5"     # backup settle
  workflow_dispatch:
    # "publish" appends nothing to the ledger; it only re-verifies the chain and
    # regenerates the site. The chain status is baked into the HTML at build
    # time, so pages built anywhere but here - where the real signing key lives -
    # misreport it. This is the way to repair them without inventing a decision.
    inputs:
      task:
        description: "which half to run (publish rebuilds the site only)"
        type: choice
        options: [check, night, morning, both, publish]
        default: both

concurrency:
  group: ballast-ledger        # never let two runs write the ledger at once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # Job-level so a step `if` can test it: the `secrets` context is not
      # available in `if`, but `env` is. Empty until the Demo key is added.
      BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
      BALLAST_VENUE: ${{ secrets.BITGET_API_KEY != '' && 'bgc' || '' }}
      # Bitget signs with a triplet; passed through so the CLI can find them.
      BITGET_SECRET_KEY: ${{ secrets.BITGET_SECRET_KEY }}
      BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The Agent Hub CLI, installed only when a Demo key exists to use it with.
      # Without the secret the step is skipped, bgc.available() reports the key is
      # unset, and fills are simulated exactly as they have been all along.
      #
      # `bgc` comes from @bitget-ai/bitget-agent-cli, NOT from the installer
      # package - and it has to be a global install, because `npx --yes` runs a
      # package once and leaves nothing on PATH for the next step. Getting this
      # wrong is silent: shutil.which("bgc") returns None, bgc.available() is
      # False, and every fill is simulated while the credentials sit correctly
      # configured. Six nights of hedges went through simulation that way.
      - name: Install the Bitget Agent Hub CLI
        if: env.BITGET_API_KEY != ''
        run: |
          npm install -g @bitget-ai/bitget-agent-cli
          npx --yes @bitget-ai/bitget-agent-installer upgrade-all --target all || true

      # Fail loudly rather than quietly simulating. A key configured but a CLI
      # missing is the one combination that looks fine and produces nothing.
      - name: The venue must be reachable when a key is configured
        if: env.BITGET_API_KEY != ''
        run: |
          command -v bgc || { echo "::error::bgc is not on PATH"; exit 1; }
          python - <<'CHECK'
          from ballast.bgc import available
          ok, why = available()
          print(f"venue: {'ready' if ok else 'UNAVAILABLE'} - {why}")
          raise SystemExit(0 if ok else "the venue is not reachable; fills would "
                                        "silently fall back to simulation")
          CHECK

      - name: Preflight (credentials, the live reader and the venue; writes nothing)
        if: inputs.task == 'check'
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          BALLAST_SECRET: ${{ secrets.BALLAST_SECRET }}
        run: python -m ballast.preflight

      - name: Decide (after the close)
        if: >-
          contains(fromJSON('["0 21 * * 1-5","30 22 * * 1-5","0 0 * * 2-6"]'),
                   github.event.schedule)
          || inputs.task == 'night' || inputs.task == 'both'
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          BALLAST_SECRET: ${{ secrets.BALLAST_SECRET }}
        run: python -m ballast.night

      - name: Settle (after the open)
        if: >-
          inputs.task != 'check'
          && (contains(fromJSON('["30 14 * * 1-5","0 17 * * 1-5"]'),
                       github.event.schedule)
              || inputs.task == 'morning' || inputs.task == 'both')
        env:
          BALLAST_SECRET: ${{ secrets.BALLAST_SECRET }}
        run: python -m ballast.morning

      # The job used to report success for having started. A run that fired but
      # produced nothing looked identical to one that worked, and the hole only
      # showed up if somebody went looking. This fails the job - and sends the
      # owner GitHub's failure mail - when a due session has no decision.
      - name: Every due session has a decision on the chain
        if: inputs.task != 'check'
        run: python tools/check_coverage.py --days 10

      - name: Refresh measured facts and export the Bitget-schema log
        if: inputs.task != 'check'
        env:
          BALLAST_SECRET: ${{ secrets.BALLAST_SECRET }}
        run: |
          python research/facts_study.py
          python -m ballast.export

      - name: Verify the chain before committing
        if: inputs.task != 'check'
        env:
          BALLAST_SECRET: ${{ secrets.BALLAST_SECRET }}
        run: |
          python - <<'EOF'
          from ballast import config
          from ballast.ledger import Ledger
          print(f"ledger verified: {Ledger(config.LEDGER_PATH, config.secret()).verify()} entries")
          EOF

      # The coverage index the site's lookup reads: 206 measured hedge fits, one
      # bounded fetch per leg. ~3 minutes, so it runs on the first cron only --
      # listings move on the scale of days, not hours. continue-on-error because
      # a decision must never be lost to a market-data hiccup in a display file:
      # when it fails the committed index simply keeps its earlier measured_on,
      # which the page shows.
      - name: Refresh the coverage index
        if: >-
          inputs.task != 'check' &&
          (github.event.schedule == '0 21 * * 1-5' ||
           github.event_name == 'workflow_dispatch')
        continue-on-error: true
        run: python -m ballast.coverage

      # The reader-vs-calendar index. Cheap - the earnings calendar it re-derives
      # from is already warm in the cache the decide step filled - but it touches a
      # public feed, so a failure must not cost the night. continue-on-error leaves
      # the previously committed index in place, and the page renders that.
      - name: Refresh the reader-vs-calendar comparison
        if: inputs.task != 'check'
        continue-on-error: true
        env:
          BALLAST_SECRET: ${{ secrets.BALLAST_SECRET }}
        run: python -m ballast.counterfactual

      - name: Rebuild the public site
        if: inputs.task != 'check'
        env:
          BALLAST_SECRET: ${{ secrets.BALLAST_SECRET }}
        run: |
          python -m ballast.report
          python -m ballast.docs_page
          # The README quotes the same measurements. CI checks it matches
          # facts.json, so a nightly refresh that moved a figure and left the
          # README behind would turn CI red until someone ran this by hand.
          python tools/readme_facts.py
          # Every page the builder declares must exist on disk afterwards.
          python - <<'EOF'
          from pathlib import Path
          from ballast.report import PAGES, OUT_DIR
          missing = [n for n, *_ in PAGES if not (OUT_DIR / n).exists()]
          missing += [] if (OUT_DIR / "docs.html").exists() else ["docs.html"]
          if missing:
              raise SystemExit(f"pages not generated: {missing}")
          print(f"generated {len(PAGES) + 1} pages")
          EOF

      - name: Commit the ledger and the rebuilt site
        if: inputs.task != 'check'
        run: |
          git config user.name  "ballast-bot"
          git config user.email "noreply@github.com"

          # Stage whole directories. The previous version listed index.html and
          # docs.html by name; when the site grew to five pages the three new ones
          # were rebuilt on the runner and thrown away, so the Tonight and Settled
          # pages never showed a scheduled decision. A named list silently goes
          # stale every time a page is added - a directory cannot.
          git add -A state/ docs/ README.md
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi

          # Rebase BEFORE committing. Rebasing an append-only JSONL commit onto a
          # remote that also appended conflicts, and the night's work is then lost
          # with the runner.
          git stash push --staged --message "pending ledger"
          git pull --rebase --autostash origin main
          git stash pop
          git add -A state/ docs/ README.md
          git commit -m "ledger: $(date -u '+%Y-%m-%d %H:%MZ')"

          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected, re-syncing (attempt $attempt)"
            git pull --rebase --autostash origin main || exit 1
          done
          exit 1
