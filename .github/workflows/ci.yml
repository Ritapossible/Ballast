name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI only reads. The default token scope is wider than this job needs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The suite is deliberately network-free and key-free: the LLM is mocked and
      # no market endpoint is touched, so CI cannot go red because a third party
      # rate-limited us.
      # Dev tooling only. It is installed here and never imported by the project,
      # so `python3 verify.py` on a fresh clone still needs nothing but Python.
      #
      # PyYAML is here for one reason: tests/test_playbook.py reads the Playbook
      # manifest with its own small reader so the suite needs no parser, and the
      # cross-check that holds that reader to PyYAML's answer can only run where
      # PyYAML exists. The suite passed without it long enough to ship five
      # errors into `verify.py`, so the comparison runs somewhere by default.
      - name: Install lint and type tooling
        run: pip install --quiet ruff==0.15.8 mypy==1.19.1 pyyaml==6.0.3

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Compile every module
        run: python -m compileall -q ballast research

      # The unit tests can see that the lookup's markup was rendered. They cannot
      # see whether the browser was ALLOWED to run it: `script-src` lives in
      # vercel.json, and a policy that forbids the file produces a page that looks
      # perfect and does nothing. So this drives the real page in a real browser
      # under the policy read from vercel.json itself.
      - name: Coverage lookup works in a browser
        run: |
          npm install --no-save --silent playwright
          npx playwright install --with-deps chromium
          # Build from THIS commit's source, not from the pages the last scheduled
          # run happened to publish, so a page change is checked before it ships.
          python tools/build_preview.py "$RUNNER_TEMP/site"
          SITE_DIR="$RUNNER_TEMP/site" node tools/check_lookup.mjs


      # The chain status is baked into the HTML when the pages are built, so a
      # rebuild carrying the development key publishes "CHAIN BROKEN" against a
      # ledger that is in fact intact. That reached the live site once. The
      # builders now refuse a keyless build; this is the second line, catching a
      # bad page however it was produced.
      - name: Published pages must not advertise a broken chain
        run: |
          python - <<'EOF'
          from pathlib import Path
          bad = {
              '<span class="pulse"></span>BROKEN</span>': "the header badge reads BROKEN",
              "\u00b7 CHAIN BROKEN": "a page states the chain is broken",
              "entries \u00b7 signatures NOT verified": "a page was built without the signing key",
          }
          found = [f"{p.name}: {why}"
                   for p in sorted(Path("docs").glob("*.html"))
                   for marker, why in bad.items() if marker in p.read_text()]
          if found:
              raise SystemExit("committed pages misreport the ledger:\n  " + "\n  ".join(found))
          print(f"{len(list(Path('docs').glob('*.html')))} pages report an intact chain")
          EOF

      # verify.py is quoted on the site as the way to check every claim. Nothing
      # checked that it still passed, so it would have rotted quietly.
      - name: Judge entry point (python3 verify.py)
        run: python verify.py

      # The README claimed 224 of 704 rTokens while facts.json said 241 of 1173.
      # Its figures are generated now, and this fails if they drift again.
      - name: README figures match docs/facts.json
        run: |
          python tools/readme_facts.py --check
          python tools/submission_counts.py --check

      - name: Ledger and mandate self-check
        run: |
          python - <<'EOF'
          import datetime as dt, tempfile, pathlib
          from ballast.ledger import Ledger
          from ballast.mandate import NightMandate, SignedMandate
          from ballast.enforcer import Enforcer, OrderIntent
          now = dt.datetime.now(dt.timezone.utc)
          m = NightMandate(issued_at=now, expires_at=now + dt.timedelta(hours=12),
                           universe=("RTSLAUSDT",), max_notional_usdt=1000.0, max_orders=5)
          e = Enforcer(SignedMandate.issue(m, b"ci"), b"ci")
          v = e.evaluate(OrderIntent("RTSLAUSDT", "TSLAUSDT", "buy", 100.0), {}, now)
          assert v.rejected, "a naked directional order was admitted"
          print("enforcer refuses a naked directional order:", v.rule)
          with tempfile.TemporaryDirectory() as d:
              lg = Ledger(pathlib.Path(d) / "l.jsonl", b"ci")
              lg.append("decision", {"ticker": "X"})
              assert lg.verify() == 1
          print("ledger chain verifies")
          EOF
