# Render Static Site. Mirrors vercel.json so the site behaves identically on
# either host.
#
# There is NO build command, deliberately. docs/ already holds the finished
# pages, committed by the nightly job with the real signing key. The chain
# verification result is baked into the HTML at build time, so regenerating the
# pages on a host that has no BALLAST_SECRET would publish "CHAIN BROKEN" about a
# ledger that is intact - which is exactly how the live site broke on 2026-09-10.
# Render serves what the nightly committed, and nothing else.
services:
  - type: web
    name: ballast
    runtime: static
    staticPublishPath: ./docs
    pullRequestPreviewsEnabled: false

    # Vercel's cleanUrls, restated. The site's own nav uses relative .html links
    # so it works without these, but every external link written as /tonight or
    # /reader - including the ones in README.md and docs/SUBMISSION.md - needs
    # them to resolve.
    routes:
      - { type: rewrite, source: /tonight, destination: /tonight.html }
      - { type: rewrite, source: /settled, destination: /settled.html }
      - { type: rewrite, source: /reader, destination: /reader.html }
      - { type: rewrite, source: /evidence, destination: /evidence.html }
      - { type: rewrite, source: /docs, destination: /docs.html }
      - { type: rewrite, source: /documentation, destination: /docs.html }

    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # The lookup on the Tonight page is the only script, it is served from this
      # origin, and it talks to nothing else. Anything wider would let a page that
      # makes verifiable claims load code that cannot be verified.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; connect-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      # The landing page states tonight's session and the chain status, so a cached
      # copy is a page asserting something that may no longer be true.
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
